<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09140e"/>
      <stop offset="60%" stop-color="#0f241a"/>
      <stop offset="100%" stop-color="#163828"/>
    </linearGradient>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="anGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#anBg)"/>

  <!-- Warm background halos -->
  <circle cx="200" cy="150" r="160" fill="#10b981" opacity="0.1" filter="url(#anGlow)"/>
  <circle cx="650" cy="280" r="150" fill="#f59e0b" opacity="0.09" filter="url(#anGlow)"/>

  <!-- Community Platform Dashboard -->
  <rect x="70" y="55" width="660" height="325" rx="14" fill="#0c1813" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>

  <!-- Top Navigation Header -->
  <rect x="70" y="55" width="660" height="45" rx="14" fill="#14261e"/>
  <circle cx="95" cy="78" r="8" fill="#10b981"/>
  <text x="115" y="83" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">ANNADANAM HYDERABAD</text>
  <rect x="530" y="65" width="180" height="26" rx="13" fill="#047857"/>
  <text x="620" y="82" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">🤝 Donate / Volunteer</text>

  <!-- Impact Stats Banner -->
  <g transform="translate(95, 115)">
    <rect width="180" height="70" rx="8" fill="#132a21" stroke="#10b981" stroke-width="1"/>
    <text x="18" y="38" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">12,500+</text>
    <text x="18" y="56" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="11">Meals Distributed</text>

    <g transform="translate(205, 0)">
      <rect width="180" height="70" rx="8" fill="#132a21" stroke="#f59e0b" stroke-width="1"/>
      <text x="18" y="38" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">45+</text>
      <text x="18" y="56" fill="#fde68a" font-family="'Segoe UI', sans-serif" font-size="11">Active Centers in Hyd</text>
    </g>

    <g transform="translate(410, 0)">
      <rect width="200" height="70" rx="8" fill="#132a21" stroke="#34d399" stroke-width="1"/>
      <text x="18" y="38" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">350+</text>
      <text x="18" y="56" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="11">Volunteers Enrolled</text>
    </g>
  </g>

  <!-- Distribution Centers & Live Feed -->
  <g transform="translate(95, 205)">
    <rect width="390" height="155" rx="10" fill="#0f2018" stroke="#1f3b2f"/>
    <text x="16" y="26" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">📍 LIVE DISTRIBUTION DRIVES</text>
    
    <rect x="16" y="38" width="358" height="50" rx="6" fill="#142c22"/>
    <text x="28" y="58" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Secunderabad Station Drive</text>
    <text x="28" y="74" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="10">500 food packets • Today, 1:00 PM • Status: Active</text>

    <rect x="16" y="96" width="358" height="50" rx="6" fill="#142c22"/>
    <text x="28" y="116" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Koti Women &amp; Children Center</text>
    <text x="28" y="132" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="10">350 food packets • Evening Drive • Volunteers Ready</text>
  </g>

  <!-- Tech Badges Side -->
  <g transform="translate(505, 205)">
    <rect width="200" height="155" rx="10" fill="#0f2018" stroke="#1f3b2f"/>
    <text x="16" y="26" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">STACK &amp; REALTIME</text>
    
    <rect x="16" y="40" width="168" height="26" rx="6" fill="#19382b"/>
    <text x="26" y="57" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10">⚡ Vite + React 18</text>

    <rect x="16" y="74" width="168" height="26" rx="6" fill="#19382b"/>
    <text x="26" y="91" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10">🔥 Firebase Realtime DB</text>

    <rect x="16" y="108" width="168" height="26" rx="6" fill="#19382b"/>
    <text x="26" y="125" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10">🎨 Tailwind CSS</text>
  </g>

  <!-- Tag Bar -->
  <rect x="70" y="395" width="660" height="36" rx="8" fill="url(#anGrad)" opacity="0.15"/>
  <text x="400" y="418" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">COMMUNITY FOOD DISTRIBUTION &amp; VOLUNTEER COORDINATION PLATFORM</text>
</svg>

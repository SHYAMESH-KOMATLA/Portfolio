<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="60%" stop-color="#0b1b36"/>
      <stop offset="100%" stop-color="#142b52"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="fnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#fnBg)"/>

  <!-- World map line curves & flight arcs -->
  <path d="M 100 320 Q 250 120 450 180 T 700 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="100" cy="320" r="5" fill="#38bdf8"/>
  <circle cx="450" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="700" cy="140" r="5" fill="#818cf8"/>

  <circle cx="450" cy="180" r="30" fill="#38bdf8" opacity="0.1" filter="url(#fnGlow)"/>

  <!-- Glassmorphic Booking Window Container -->
  <rect x="70" y="60" width="660" height="320" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5"/>

  <!-- Navbar inside mockup -->
  <rect x="70" y="60" width="660" height="45" rx="14" fill="rgba(30, 41, 59, 0.7)"/>
  <text x="95" y="88" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800">FLYNOW ✈</text>
  <text x="210" y="87" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Flights</text>
  <text x="270" y="87" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Hotels</text>
  <text x="330" y="87" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Packages</text>
  <rect x="580" y="70" width="130" height="26" rx="13" fill="#0284c7"/>
  <text x="645" y="87" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Day / Night Theme</text>

  <!-- Flight Search Card -->
  <rect x="95" y="125" width="610" height="85" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
  <text x="115" y="150" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">DEPARTURE</text>
  <text x="115" y="175" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">HYD (Hyderabad)</text>

  <text x="290" y="165" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="18">✈ ➔</text>

  <text x="360" y="150" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">DESTINATION</text>
  <text x="360" y="175" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">DXB (Dubai, UAE)</text>

  <rect x="555" y="145" width="130" height="42" rx="8" fill="#38bdf8"/>
  <text x="620" y="171" text-anchor="middle" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Search Deals</text>

  <!-- Destination Cards Grid -->
  <g transform="translate(95, 230)">
    <rect width="190" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
    <rect width="190" height="70" rx="8" fill="#1e3a5f"/>
    <text x="15" y="42" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Maldives Getaway</text>
    <text x="15" y="95" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">5 Nights All-Inclusive</text>
    <text x="15" y="115" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11">From ₹45,999</text>
  </g>

  <g transform="translate(305, 230)">
    <rect width="190" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
    <rect width="190" height="70" rx="8" fill="#2d2a58"/>
    <text x="15" y="42" fill="#ddd6fe" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Parisian Escape</text>
    <text x="15" y="95" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Flight + Boutique Stay</text>
    <text x="15" y="115" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="11">From ₹68,500</text>
  </g>

  <g transform="translate(515, 230)">
    <rect width="190" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
    <rect width="190" height="70" rx="8" fill="#16393b"/>
    <text x="15" y="42" fill="#99f6e4" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Bali Tropical Tour</text>
    <text x="15" y="95" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Private Villa &amp; Guides</text>
    <text x="15" y="115" fill="#2dd4bf" font-family="'Segoe UI', sans-serif" font-size="11">From ₹32,000</text>
  </g>

  <!-- Tag Bar -->
  <rect x="70" y="395" width="660" height="36" rx="8" fill="url(#goldGrad)" opacity="0.15"/>
  <text x="400" y="418" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">FULL-STACK LUXURY TRAVEL &amp; FLIGHT BOOKING PLATFORM</text>
</svg>

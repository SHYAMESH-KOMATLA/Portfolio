<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#191538"/>
    </linearGradient>
    <linearGradient id="hhGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="hhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#hhBg)"/>

  <!-- Glowing background circles -->
  <circle cx="150" cy="120" r="160" fill="#6366f1" opacity="0.1" filter="url(#hhGlow)"/>
  <circle cx="680" cy="300" r="150" fill="#00f0ff" opacity="0.08" filter="url(#hhGlow)"/>

  <!-- Recruitment Board Container -->
  <rect x="60" y="55" width="680" height="325" rx="14" fill="#0b1120" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="60" y="55" width="680" height="45" rx="14" fill="#131c35"/>
  <circle cx="85" cy="78" r="6" fill="#6366f1"/>
  <text x="105" y="83" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">HIRE SPHERE / HIREHUB</text>
  <rect x="520" y="65" width="200" height="26" rx="6" fill="#1e293b"/>
  <text x="535" y="82" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">🔍 Search Candidates, Jobs...</text>

  <!-- Pipeline Columns -->
  <!-- Col 1: Sourced -->
  <g transform="translate(80, 115)">
    <rect width="190" height="240" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="14" y="24" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">APPLIED (42)</text>
    <rect x="12" y="38" width="166" height="58" rx="8" fill="#1e293b"/>
    <circle cx="32" cy="58" r="12" fill="#3b82f6"/>
    <text x="52" y="55" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Alex Morgan</text>
    <text x="52" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Full Stack Engineer</text>
    <rect x="12" y="104" width="166" height="58" rx="8" fill="#1e293b"/>
    <circle cx="32" cy="124" r="12" fill="#10b981"/>
    <text x="52" y="121" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">David Chen</text>
    <text x="52" y="136" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Backend (Java/Spring)</text>
  </g>

  <!-- Col 2: In Interview -->
  <g transform="translate(290, 115)">
    <rect width="190" height="240" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="14" y="24" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">INTERVIEWING (18)</text>
    <rect x="12" y="38" width="166" height="74" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="32" cy="62" r="12" fill="#8b5cf6"/>
    <text x="52" y="58" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Sarah Jenkins</text>
    <text x="52" y="73" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="10">Technical Score: 94/100</text>
    <rect x="22" y="85" width="60" height="16" rx="4" fill="#312e81"/>
    <text x="28" y="97" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">ATS Match</text>
    <rect x="88" y="85" width="80" height="16" rx="4" fill="#064e3b"/>
    <text x="94" y="97" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600">Scorecard OK</text>
  </g>

  <!-- Col 3: Hired -->
  <g transform="translate(500, 115)">
    <rect width="220" height="240" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="14" y="24" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">OFFER EXTENDED (6)</text>
    <rect x="12" y="38" width="196" height="85" rx="8" fill="#064e3b" opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <circle cx="36" cy="64" r="14" fill="#10b981"/>
    <text x="58" y="60" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Priya Sharma</text>
    <text x="58" y="76" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10">Senior UI/UX Architect</text>
    <text x="24" y="105" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="10">🎉 Offer Accepted • ₹18 LPA</text>
  </g>

  <!-- Bottom Banner Bar -->
  <rect x="60" y="395" width="680" height="36" rx="8" fill="url(#hhGrad)" opacity="0.15"/>
  <text x="400" y="418" text-anchor="middle" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">MODERN RECRUITMENT &amp; TALENT ORCHESTRATION PLATFORM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.1" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glowing Glow spots -->
  <circle cx="200" cy="180" r="140" fill="#00f0ff" opacity="0.08" filter="url(#glow)"/>
  <circle cx="620" cy="240" r="130" fill="#7928ca" opacity="0.1" filter="url(#glow)"/>

  <!-- Code / IDE Window Mockup -->
  <rect x="70" y="70" width="460" height="300" rx="12" fill="#0d111c" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
  <!-- Window Header -->
  <rect x="70" y="70" width="460" height="36" rx="12" fill="#141a2b"/>
  <circle cx="95" cy="88" r="5" fill="#ff5f56"/>
  <circle cx="112" cy="88" r="5" fill="#ffbd2e"/>
  <circle cx="129" cy="88" r="5" fill="#27c93f"/>
  <text x="155" y="93" fill="#8892b0" font-family="'Segoe UI', monospace" font-size="12">assessment_test.ts • Monaco Code Runner</text>
  
  <!-- Code lines -->
  <rect x="95" y="125" width="130" height="8" rx="4" fill="#00f0ff" opacity="0.8"/>
  <rect x="235" y="125" width="80" height="8" rx="4" fill="#a78bfa" opacity="0.7"/>
  <rect x="115" y="145" width="200" height="8" rx="4" fill="#64748b" opacity="0.6"/>
  <rect x="115" y="165" width="260" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="135" y="185" width="150" height="8" rx="4" fill="#34d399" opacity="0.7"/>
  <rect x="135" y="205" width="180" height="8" rx="4" fill="#f472b6" opacity="0.7"/>
  <rect x="115" y="225" width="90" height="8" rx="4" fill="#64748b" opacity="0.6"/>
  
  <!-- Execution Result Pill -->
  <rect x="95" y="260" width="240" height="34" rx="8" fill="#102a24" stroke="#10b981" stroke-width="1"/>
  <circle cx="115" cy="277" r="4" fill="#10b981"/>
  <text x="128" y="282" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">✓ All 12 Test Cases Passed (42ms)</text>

  <rect x="95" y="306" width="380" height="42" rx="8" fill="#161e31"/>
  <text x="110" y="332" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">ATS Evaluation: 96% Match • AI Proctoring Active</text>

  <!-- Side Card / Proctoring HUD -->
  <g transform="translate(560, 80)">
    <rect width="170" height="280" rx="12" fill="#0d111c" stroke="rgba(121, 40, 202, 0.4)" stroke-width="1.5"/>
    <rect width="170" height="34" rx="12" fill="#1b1735"/>
    <text x="18" y="22" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">PROCTOR HUD</text>
    
    <!-- Mini Camera box -->
    <rect x="18" y="48" width="134" height="90" rx="8" fill="#191d30" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="85" cy="85" r="22" fill="#2d3748"/>
    <circle cx="85" cy="78" r="10" fill="#4a5568"/>
    <path d="M72 100 Q85 92 98 100" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="85" y="128" text-anchor="middle" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">FACE VERIFIED</text>
    
    <!-- Score bars -->
    <text x="18" y="160" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Technical Score</text>
    <rect x="18" y="168" width="134" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="168" width="124" height="6" rx="3" fill="#00f0ff"/>
    
    <text x="18" y="195" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Problem Solving</text>
    <rect x="18" y="203" width="134" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="203" width="118" height="6" rx="3" fill="#7928ca"/>

    <text x="18" y="230" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Code Quality</text>
    <rect x="18" y="238" width="134" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="238" width="128" height="6" rx="3" fill="#10b981"/>
  </g>

  <!-- Big Brand Tag -->
  <rect x="70" y="390" width="660" height="38" rx="8" fill="url(#accentGrad)" opacity="0.15"/>
  <text x="400" y="415" text-anchor="middle" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2">PREPARE NOW • TECHNICAL ASSESSMENT &amp; EVALUATION PLATFORM</text>
</svg>
